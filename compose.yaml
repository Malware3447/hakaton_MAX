name: nakladnaya

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nakladnaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakladnaya}
      POSTGRES_DB: ${POSTGRES_DB:-nakladnaya}
    volumes:
      # С postgres 18 том монтируется в /var/lib/postgresql, а не в .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nakladnaya}:${POSTGRES_PASSWORD:-nakladnaya}@postgres:5432/${POSTGRES_DB:-nakladnaya}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
